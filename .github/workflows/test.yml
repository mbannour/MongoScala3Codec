# steward:off
name: Test Scala Library

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  # ── Metadata consistency (no sbt needed, runs fast) ─────────────────
  metadata-check:
    runs-on: ubuntu-latest
    name: Metadata Consistency
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and license consistency
        run: |
          set -euo pipefail

          # --- Extract canonical values from build.sbt ---
          SBT_VERSION=$(grep -oP 'version\s*:=\s*"\K[^"]+' build.sbt | head -1)
          SBT_LICENSE=$(grep -oP 'licenses\s*\+=\s*\("\K[^"]+' build.sbt | head -1)

          echo "build.sbt version : $SBT_VERSION"
          echo "build.sbt license : $SBT_LICENSE"

          ERRORS=0

          # --- README badge version ---
          README_BADGE_VER=$(grep -oP 'mongoScala3Codecs-\K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)
          if [[ "$README_BADGE_VER" != "$SBT_VERSION" ]]; then
            echo "::error file=README.md::Version badge shows $README_BADGE_VER but build.sbt is $SBT_VERSION"
            ERRORS=$((ERRORS+1))
          fi

          # --- README dependency examples ---
          while IFS= read -r readme_ver; do
            if [[ "$readme_ver" != "$SBT_VERSION" ]]; then
              echo "::error file=README.md::Dependency example shows $readme_ver but build.sbt is $SBT_VERSION"
              ERRORS=$((ERRORS+1))
            fi
          done < <(grep -oP 'mongoscala3codec"\s*%\s*"\K[^"]+' README.md)

          # --- LICENSE file must be Apache-2.0 ---
          if ! grep -q "Apache License" LICENSE; then
            echo "::error file=LICENSE::LICENSE file does not contain Apache License text"
            ERRORS=$((ERRORS+1))
          fi
          if [[ "$SBT_LICENSE" != "Apache-2.0" ]]; then
            echo "::error file=build.sbt::build.sbt declares license '$SBT_LICENSE' but LICENSE file is Apache-2.0"
            ERRORS=$((ERRORS+1))
          fi

          # --- docs version references ---
          while IFS= read -r docs_ver; do
            if [[ "$docs_ver" != "$SBT_VERSION" ]]; then
              echo "::error file=docs::Docs dependency example shows $docs_ver but build.sbt is $SBT_VERSION"
              ERRORS=$((ERRORS+1))
            fi
          done < <(grep -rhoP 'mongoscala3codec"\s*%\s*"\K[^"]+' docs/ 2>/dev/null)

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::$ERRORS metadata inconsistency(ies) found — fix build.sbt, README.md, or docs/ before merging"
            exit 1
          fi

          echo "All metadata checks passed (version=$SBT_VERSION, license=$SBT_LICENSE)"

  # ── Formatting (runs once, gates all other jobs) ────────────────────
  format:
    runs-on: ubuntu-latest
    name: Check Formatting
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting (sources + build files)
        run: sbt scalafmtCheckAll scalafmtSbtCheck

  # ── Unit tests (full Scala × JDK matrix) ───────────────────────────
  test:
    runs-on: ubuntu-latest
    name: Test (Scala ${{ matrix.scala }}, JDK ${{ matrix.java }})
    needs: [ format ]
    timeout-minutes: 30

    strategy:
      matrix:
        # Published cross-versions (must match crossScalaVersions in build.sbt):
        #   3.3.1, 3.4.2, 3.6.4, 3.7.1
        # Forward-compat probe (not published, binary-compatible via _3 suffix):
        #   3.8.0
        scala: [ "3.3.1", "3.4.2", "3.6.4", "3.7.1", "3.8.0" ]
        java: [ "11", "17", "19", "21" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Zulu provides builds for ALL JDK versions 11–21 (including non-LTS)
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run unit tests
        run: sbt ++${{ matrix.scala }} test

  # ── Integration tests (primary Scala version only, LTS JDKs) ───────
  # integrationTests subproject is pinned to the primary Scala version
  # (see crossScalaVersions in build.sbt), so no ++ version switch here.
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests (JDK ${{ matrix.java }})
    needs: [ format ]
    timeout-minutes: 30

    strategy:
      matrix:
        java: [ "11", "17", "21" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run integration tests
        run: sbt integrationTests/test

  # ── JMH benchmark compile check ────────────────────────────────────
  # benchmarks subproject is pinned to the primary Scala version.
  benchmark-compile:
    runs-on: ubuntu-latest
    name: JMH Smoke Compile
    needs: [ format ]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Compile benchmarks
        run: sbt "benchmarks / Jmh / compile"

  # ── Code coverage ──────────────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    name: Code Coverage
    needs: [ format ]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # coverageFailOnMinimum in build.sbt enforces the 50% threshold
      - name: Run tests with coverage
        run: sbt clean coverage test coverageReport

      - name: Find coverage report
        id: coverage-report
        run: |
          REPORT=$(find . -path "*/scoverage-report/scoverage.xml" -type f | head -1)
          if [[ -z "$REPORT" ]]; then
            echo "::error::No scoverage report found"
            exit 1
          fi
          echo "path=$REPORT" >> "$GITHUB_OUTPUT"
          COVERAGE=$(grep -oP 'statement-rate="\K[^"]+' "$REPORT" | head -1)
          echo "### Code Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ steps.coverage-report.outputs.path }}
          fail_ci_if_error: false

  # ── Gate (branch protection target) ────────────────────────────────
  all-tests-passed:
    runs-on: ubuntu-latest
    name: All Tests Passed
    if: always()
    needs: [ metadata-check, test, integration-test, benchmark-compile, coverage ]

    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.metadata-check.result }}"
            "${{ needs.test.result }}"
            "${{ needs.integration-test.result }}"
            "${{ needs.benchmark-compile.result }}"
            "${{ needs.coverage.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All tests passed!"
# scala-steward:on
