# steward:off
name: Test Scala Library

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  # ── Formatting (runs once, gates all other jobs) ────────────────────
  format:
    runs-on: ubuntu-latest
    name: Check Formatting
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting (sources + build files)
        run: sbt scalafmtCheckAll scalafmtSbtCheck

  # ── Unit tests (full Scala × JDK matrix) ───────────────────────────
  test:
    runs-on: ubuntu-latest
    name: Test (Scala ${{ matrix.scala }}, JDK ${{ matrix.java }})
    needs: [ format ]
    timeout-minutes: 30

    strategy:
      matrix:
        scala: [ "3.3.1", "3.4.2", "3.6.4", "3.7.1", "3.8.0" ]
        java: [ "11", "17", "19", "21" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Zulu provides builds for ALL JDK versions 11–21 (including non-LTS)
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run unit tests
        run: sbt ++${{ matrix.scala }} test

  # ── Integration tests (primary Scala version only, LTS JDKs) ───────
  # integrationTests subproject is pinned to the primary Scala version
  # (see crossScalaVersions in build.sbt), so no ++ version switch here.
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests (JDK ${{ matrix.java }})
    needs: [ format ]
    timeout-minutes: 30

    strategy:
      matrix:
        java: [ "11", "17", "21" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run integration tests
        run: sbt integrationTests/test

  # ── JMH benchmark compile check ────────────────────────────────────
  # benchmarks subproject is pinned to the primary Scala version.
  benchmark-compile:
    runs-on: ubuntu-latest
    name: JMH Smoke Compile
    needs: [ format ]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Compile benchmarks
        run: sbt "benchmarks / Jmh / compile"

  # ── Binary compatibility ───────────────────────────────────────────
  # MiMa compares the current build against the published baseline pinned in
  # build.sbt (binaryCompatibilityBaseline). Runs on the default Scala version
  # only: every Scala 3 build publishes the same _3 artifact.
  binary-compatibility:
    runs-on: ubuntu-latest
    name: Binary Compatibility (MiMa)
    needs: [ format ]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check binary compatibility
        run: sbt mimaReportBinaryIssues

  # ── Code coverage ──────────────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    name: Code Coverage
    needs: [ format ]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # coverageFailOnMinimum in build.sbt enforces the 50% threshold
      - name: Run tests with coverage
        run: sbt clean coverage test coverageReport

      - name: Find coverage report
        id: coverage-report
        run: |
          REPORT=$(find . -path "*/scoverage-report/scoverage.xml" -type f | head -1)
          if [[ -z "$REPORT" ]]; then
            echo "::error::No scoverage report found"
            exit 1
          fi
          echo "path=$REPORT" >> "$GITHUB_OUTPUT"
          COVERAGE=$(grep -oP 'statement-rate="\K[^"]+' "$REPORT" | head -1)
          echo "### Code Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ steps.coverage-report.outputs.path }}
          fail_ci_if_error: false

  # ── Gate (branch protection target) ────────────────────────────────
  all-tests-passed:
    runs-on: ubuntu-latest
    name: All Tests Passed
    if: always()
    needs: [ test, integration-test, benchmark-compile, coverage, binary-compatibility ]

    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.test.result }}"
            "${{ needs.integration-test.result }}"
            "${{ needs.benchmark-compile.result }}"
            "${{ needs.coverage.result }}"
            "${{ needs.binary-compatibility.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All tests passed!"
# scala-steward:on
